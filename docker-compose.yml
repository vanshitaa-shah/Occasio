services:
  postgres:
    image: postgres:16-alpine
    container_name: occasio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: occasio
      POSTGRES_PASSWORD: occasio
      POSTGRES_DB: occasio
    ports:
      - "5432:5432"
    volumes:
      - occasio-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U occasio"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: occasio-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI -> http://localhost:8025

  redis:
    image: redis:7-alpine
    container_name: occasio-redis
    restart: unless-stopped
    # Persist queued jobs across restarts (AOF); never evict them.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - occasio-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  occasio-pgdata:
  occasio-redisdata:
