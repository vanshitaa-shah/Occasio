services:
  postgres:
    image: postgres:16-alpine
    container_name: occasio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: occasio
      POSTGRES_PASSWORD: occasio
      POSTGRES_DB: occasio
    ports:
      - "5432:5432"
    volumes:
      - occasio-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U occasio"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: occasio-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI -> http://localhost:8025

volumes:
  occasio-pgdata:
