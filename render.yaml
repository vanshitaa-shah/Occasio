# Render blueprint — deploy Occasio as one Docker web service + managed Postgres.
# In Render: New → Blueprint → connect this repo. Then set the three secret env
# vars (SMTP_USER, SMTP_PASS, SMTP_FROM) in the dashboard. See DEPLOY.md.
services:
  - type: web
    name: occasio
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free plan for a $0 demo. The scheduler polls continuously and Render's
    # free web tier SLEEPS after ~15min idle, so this relies on an external
    # keep-alive ping hitting healthCheckPath (see DEPLOY.md step 4) — without
    # it, sends are delayed until the next request wakes the service. For
    # real production use, switch this to `plan: starter` instead.
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Session signing secret — Render generates a strong value.
      - key: JWT_SECRET
        generateValue: true
      # Managed Postgres connection string (from the database below).
      - key: DATABASE_URL
        fromDatabase:
          name: occasio-db
          property: connectionString
      # ---- Email (Brevo SMTP relay; any SMTP provider works) ----
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      # Secrets — set these in the Render dashboard (not in git):
      - key: SMTP_USER # your Brevo account login email
        sync: false
      - key: SMTP_PASS # your Brevo SMTP key (SMTP & API → SMTP tab)
        sync: false
      - key: SMTP_FROM # e.g. "Occasio <no-reply@yourdomain.com>" (verified sender)
        sync: false
    # RENDER_BASE_URL is intentionally unset: the service renders against itself
    # (http://localhost:$PORT/render), which it serves.

databases:
  - name: occasio-db
    plan: free # 90-day free Postgres; upgrade before it expires for real use
