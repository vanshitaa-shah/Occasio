# Render blueprint — deploy Occasio as one Docker web service + managed Postgres.
# In Render: New → Blueprint → connect this repo. Then set the two secret env
# vars (SMTP_PASS, SMTP_FROM) in the dashboard. See DEPLOY.md.
services:
  - type: web
    name: occasio
    runtime: docker
    dockerfilePath: ./Dockerfile
    # The scheduler polls continuously, so the service must stay awake.
    # Render's free web tier SLEEPS on idle → use a paid always-on plan.
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Session signing secret — Render generates a strong value.
      - key: JWT_SECRET
        generateValue: true
      # Managed Postgres connection string (from the database below).
      - key: DATABASE_URL
        fromDatabase:
          name: occasio-db
          property: connectionString
      # ---- Email (Resend example; any SMTP provider works) ----
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: resend
      # Secrets — set these in the Render dashboard (not in git):
      - key: SMTP_PASS # your Resend API key
        sync: false
      - key: SMTP_FROM # e.g. "Occasio <no-reply@yourdomain.com>" (verified sender)
        sync: false
    # RENDER_BASE_URL is intentionally unset: the service renders against itself
    # (http://localhost:$PORT/render), which it serves.

databases:
  - name: occasio-db
    plan: free # 90-day free Postgres; upgrade before it expires for real use
